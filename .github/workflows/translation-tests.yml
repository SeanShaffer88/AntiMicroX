name: Translation lookup tests

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: translation-tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    translation-tests:
        timeout-minutes: 15
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-22.04
                      major: 5
                      packages: qtbase5-dev
                    - os: ubuntu-22.04
                      major: 6
                      packages: qt6-base-dev
                    - os: windows-2022
                      major: 5
                      qt: '5.15.2'
                      arch: win64_msvc2019_64
                    - os: windows-2022
                      major: 6
                      qt: '6.10.0'
                      arch: win64_msvc2022_64
        name: Translation lookup (${{ matrix.os }}, Qt ${{ matrix.major }})
        steps:
            - uses: actions/checkout@v4
            - name: Install Qt (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y cmake ninja-build ${{ matrix.packages }}
            - name: Install Qt (Windows)
              if: runner.os == 'Windows'
              uses: jurplel/install-qt-action@v4
              with:
                  version: ${{ matrix.qt }}
                  host: windows
                  target: desktop
                  arch: ${{ matrix.arch }}
                  cache: true
            - name: Configure (Linux)
              if: runner.os == 'Linux'
              run: >-
                  cmake -S tests/translations -B build-translations -G Ninja
                  -DCMAKE_BUILD_TYPE=Debug
                  -DQT_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt${{ matrix.major }}
            - name: Configure (Windows)
              if: runner.os == 'Windows'
              run: >-
                  cmake -S tests/translations -B build-translations -A x64
                  -DQT_DIR="$env:QT_ROOT_DIR/lib/cmake/Qt${{ matrix.major }}"
            - name: Build
              shell: bash
              run: |
                  set -o pipefail
                  cmake --build build-translations --config Debug --parallel 2 2>&1 | tee build-output.log
            - name: Test (Linux)
              if: runner.os == 'Linux'
              run: ctest --test-dir build-translations --output-on-failure
            - name: Test (Windows)
              if: runner.os == 'Windows'
              run: |
                  ctest --test-dir build-translations -C Debug --verbose --output-on-failure
                  $testExitCode = $LASTEXITCODE
                  if (Test-Path build-translations/translation-results.txt) {
                      Get-Content build-translations/translation-results.txt
                  }
                  exit $testExitCode
            - name: Report failing checks
              if: failure()
              shell: bash
              run: |
                  if [ -f build-output.log ]; then
                      grep -E "error:" build-output.log | head -n 10 | while IFS= read -r line; do
                          echo "::error::$line"
                      done
                  fi
                  if [ -f build-translations/translation-results.txt ]; then
                      grep -E "^(FAIL!|QFATAL|Received signal)" -A 2 build-translations/translation-results.txt | head -n 20 |
                          while IFS= read -r line; do
                              echo "::error::$line"
                          done
                  fi
              continue-on-error: true
